name: CI

on:
  pull_request:
  push:
    branches: [ main ]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v7

      - name: Установить Java 21
        uses: actions\setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Собрать и прогнать тесты
        run: mvn --batch-mode --no-transfer-progress verify
